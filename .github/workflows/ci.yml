name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published on current runners.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # :app was missing here, so nothing under app/src/test ever ran on CI.
      - name: Unit tests
        run: ./gradlew :core:jvmTest :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug
          path: app/build/outputs/apk/debug/*.apk

  # The one place the iOS targets are really compiled.
  #
  # Kotlin/Native builds Apple targets only on macOS. On Linux and Windows Gradle prints "the
  # following Kotlin/Native targets cannot be built on this machine and are disabled" and marks
  # every iOS task SKIPPED, so a `compileKotlinIosArm64` step on an ubuntu runner reports BUILD
  # SUCCESSFUL in a second having compiled nothing. (This job used to be a step of `build`, where
  # that is exactly what it did.) Klib cross-compilation does not rescue it either: the Linux
  # toolchain ships no Apple platform libraries, so `platform.Foundation` and even `posix` do not
  # resolve. macOS minutes are free for a public repository.
  ios-compile:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Gradle build configures :app too, which needs an Android SDK even though only :core
      # is built here.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.0.21
      - name: Compile shared code for iOS
        run: ./gradlew :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64 :core:compileKotlinIosX64 --stacktrace
      # A skipped task is a green build, so assert the klibs exist rather than trusting the exit code.
      - name: Check the iOS klibs were produced
        run: |
          for target in iosArm64 iosSimulatorArm64 iosX64; do
            klib="core/build/classes/kotlin/$target/main/klib/core.klib"
            test -s "$klib" || { echo "::error::$klib was not produced; the iOS compile was skipped"; exit 1; }
          done

  harness-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
          path: build/harness-0.2.2-rc.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: Build pinned harness
        working-directory: build/harness-0.2.2-rc.1
        run: |
          pnpm install --frozen-lockfile
          # POSIX session checkpoints require the native flock addon before any model turn.
          pnpm run build:native-system
          pnpm run build:lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Real harness conformance
        env:
          DSH_HARNESS_SRC: ${{ github.workspace }}/build/harness-0.2.2-rc.1
        run: ./gradlew :core:jvmTest :conformance:test --stacktrace
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-conformance-results
          path: |
            conformance/build/reports/tests/test
            conformance/build/conformance-logs
