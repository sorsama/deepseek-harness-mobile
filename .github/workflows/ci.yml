name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published on current runners.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      # :app was missing here, so nothing under app/src/test ever ran on CI.
      - name: Unit tests
        run: ./gradlew :core:test :mock-harness:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug
          path: app/build/outputs/apk/debug/*.apk

  harness-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
          path: build/harness-0.2.2-rc.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - name: Build pinned harness
        working-directory: build/harness-0.2.2-rc.1
        run: |
          pnpm install --frozen-lockfile
          # POSIX session checkpoints require the native flock addon before any model turn.
          pnpm run build:native-system
          pnpm run build:lib
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Real harness conformance
        env:
          DSH_HARNESS_SRC: ${{ github.workspace }}/build/harness-0.2.2-rc.1
        run: ./gradlew :core:test :conformance:test --stacktrace
      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-conformance-results
          path: |
            conformance/build/reports/tests/test
            conformance/build/conformance-logs
