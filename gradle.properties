# JVM / Gradle
# Do NOT set org.gradle.java.home here: a machine-specific path breaks CI.
# Gradle auto-detects the JDK from JAVA_HOME (set by actions/setup-java on CI
# and by your local environment).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Lint
# The lint that AGP 8.7.3 bundles crashes on the lint checks inside androidx Compose 1.11 ("Found class
# KaFunctionCall, but interface was expected"). This runs the lint of AGP 8.13.2 with the AGP above; it
# changes lint only, not the build. Drop it when AGP itself reaches 8.13.
android.experimental.lint.version=8.13.2
