[versions]
agp = "8.7.3"
kotlin = "2.3.21"
# KSP2: no longer tied to the Kotlin version. 2.3.7 is the newest that runs on the AGP above: 2.3.8 dropped
# its fallback to the legacy variant API for AGP before 8.10, and 2.3.12 requires AGP 8.12.
ksp = "2.3.7"
# 2.57.2: the Hilt Gradle plugin knows KSP2 tasks from 2.54, and 2.57 is the first that reads Kotlin 2.2+
# metadata (it no longer shades kotlin-metadata-jvm). 2.59 and later need AGP 9.
hilt = "2.57.2"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
# The BOM that lists the androidx Compose (1.11.2) and Material3 (1.4.0) that Compose Multiplatform 1.11.1
# is built on, so the app and `:sharedUi` resolve one Compose on Android.
composeBom = "2026.05.01"
navigationCompose = "2.8.5"
hiltNavigationCompose = "1.2.0"
coroutines = "1.9.0"
serializationJson = "1.7.3"
# Pinned to the kotlinx-io that Ktor 3.0.3 resolves (checked with `:mock-harness:dependencies`), so
# the iOS transport that will sit on Ktor's Darwin engine shares one set of Source/Sink types with
# the common transport seam instead of two versions of them.
kotlinxIo = "0.5.4"
# The Gradle plugin and the runtime library share this one version. It has to be bumped together
# with `kotlin`: the plugin rewrites compiled classes, so a Kotlin upgrade is where it breaks.
atomicfu = "0.31.0"
okhttp = "4.12.0"
gson = "2.11.0"
zxingEmbedded = "4.3.0"
datastore = "1.1.1"
workManager = "2.10.0"
splashscreen = "1.0.1"
appcompat = "1.7.0"
ktor = "3.0.3"
junit = "4.13.2"
junitVersion = "1.2.1"
espresso = "3.6.1"
kotlinxCoroutinesTest = "1.9.0"
androidxTestRunner = "1.6.2"
# Jetpack WindowManager: `WindowInfoTracker` reports the fold or hinge that crosses the window
# (`FoldingFeature`), and `window-core` (plain JVM, a runtime-only dependency of it, so named here
# too) holds the Material window size classes the shell picks its layout by. 1.3.0 needs
# compileSdk 34, so it builds against this repo's compileSdk 35 / AGP 8.7 without moving the Compose BOM.
# androidx Compose UI 1.11 (the Compose Multiplatform 1.11 upgrade) depends on window 1.5.0 itself, so 1.5.0
# (minCompileSdk 34) is what the app resolves.
androidxWindow = "1.3.0"
commonmark = "0.24.0"
# The built-in harness runtime (see docs/ARCHITECTURE.md). EdDSA-Java checks the release manifest's Ed25519
# signature on API 26 to 32, where the platform has no Ed25519 (63 KB, no dependencies). zstd-jni unpacks the
# layers (zstd with a 128 MiB window): its Android AAR, native code for four ABIs, all 16 KB aligned. 1.5.7-12
# is the newest AAR that does not require compileSdk 37.
eddsa = "0.3.0"
zstdJni = "1.5.7-12"
# Compose Multiplatform for the UI both apps share (`:sharedUi`). 1.11.1 is the newest release whose Android
# side builds with compileSdk 35: it is built on androidx Compose 1.11.2 (minCompileSdk 35, AGP 8.6+), while
# 1.12 is built on Compose 1.12, which needs compileSdk 37 and AGP 9.1. Its Kotlin/Native klibs need Kotlin 2.3
# (`kotlin` above). On Android every `org.jetbrains.compose.*` coordinate redirects to the androidx one, so
# `composeBom` has to list the same Compose. Material3 has its own version: 1.9.0 is the stable release the
# 1.11.1 Gradle plugin itself defaults to, built on androidx Material3 1.4.0, the one the BOM lists.
composeMultiplatform = "1.11.1"
composeMultiplatformMaterial3 = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinxIo" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
okhttp-tls = { group = "com.squareup.okhttp3", name = "okhttp-tls", version.ref = "okhttp" }
eddsa = { group = "net.i2p.crypto", name = "eddsa", version.ref = "eddsa" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
zxing-android-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxingEmbedded" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
# The engine behind the iOS transport. Resolves only for the iOS targets (it has no JVM variant).
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
# A pure-Kotlin engine, used on the JVM only by tests and the conformance suite to run the Ktor
# transport where no iOS device exists. It is deliberately not OkHttp, so the Ktor pass does not
# share an HTTP stack with the OkHttp pass it is being compared against.
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { group = "org.commonmark", name = "commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-autolink = { group = "org.commonmark", name = "commonmark-ext-autolink", version.ref = "commonmark" }
commonmark-ext-task-list-items = { group = "org.commonmark", name = "commonmark-ext-task-list-items", version.ref = "commonmark" }
commonmark-ext-heading-anchor = { group = "org.commonmark", name = "commonmark-ext-heading-anchor", version.ref = "commonmark" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "androidxWindow" }
androidx-window-core = { group = "androidx.window", name = "window-core", version.ref = "androidxWindow" }
androidx-window-testing = { group = "androidx.window", name = "window-testing", version.ref = "androidxWindow" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Compose Multiplatform libraries for `:sharedUi`, named here because the Gradle plugin's `compose.*`
# accessors are deprecated since 1.10.
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
cmp-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "composeMultiplatform" }
cmp-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMultiplatformMaterial3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinx-atomicfu = { id = "org.jetbrains.kotlinx.atomicfu", version.ref = "atomicfu" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
